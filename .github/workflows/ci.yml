name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Setup Minio
        timeout-minutes: 5
        run: |
          docker run -d -p 9000:9000 --name minio -e "MINIO_ROOT_USER=root" -e "MINIO_ROOT_PASSWORD=password" -v /tmp/data:/data -v /tmp/config:/root/.minio minio/minio server /data
          # Wait for Minio to be ready
          timeout 60 bash -c 'until curl -f http://localhost:9000/minio/health/live; do sleep 2; done'

      - name: Create MinIO test bucket
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 root password
          mc mb local/relog-test

      - name: Run tests
        run: bun run test
        env:
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: root
          MINIO_SECRET_KEY: password
          MINIO_BUCKET: relog-test

      - name: Build docs
        working-directory: docs
        run: bun run build

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: python
        run: uv sync

      - name: Type check
        working-directory: python
        run: uv run mypy src/relog/

      - name: Run unit tests
        working-directory: python
        run: uv run pytest tests/ --ignore=tests/test_integration.py -v

  python-integration:
    name: Python Integration
    runs-on: ubuntu-latest
    needs: [ci, python]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        run: uv python install 3.12

      - name: Install Python dependencies
        working-directory: python
        run: uv sync

      - name: Run integration tests
        working-directory: python
        run: uv run pytest tests/test_integration.py -v
