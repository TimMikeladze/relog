name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Setup Minio
        timeout-minutes: 5
        run: |
          docker run -d -p 9000:9000 --name minio -e "MINIO_ROOT_USER=root" -e "MINIO_ROOT_PASSWORD=password" -v /tmp/data:/data -v /tmp/config:/root/.minio minio/minio server /data
          # Wait for Minio to be ready
          timeout 60 bash -c 'until curl -f http://localhost:9000/minio/health/live; do sleep 2; done'

      - name: Create MinIO test bucket
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 root password
          mc mb local/relog-test

      - name: Run tests
        run: bun run test
        env:
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: root
          MINIO_SECRET_KEY: password
          MINIO_BUCKET: relog-test

      - name: Run app UI tests
        working-directory: app
        run: bun run test

      - name: Build docs
        working-directory: docs
        run: bun run build

  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: python
        run: uv sync

      - name: Type check
        working-directory: python
        run: uv run mypy src/relog/

      - name: Run unit tests
        working-directory: python
        run: uv run pytest tests/ --ignore=tests/test_integration.py -v

  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    # Gated on `ci` only. That job builds and tests the server being shipped;
    # the Python jobs cover a client library that is released separately via
    # tags, so a failure there shouldn't hold back a server deploy.
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Deliberately NOT the workflow-level concurrency group: that one sets
    # cancel-in-progress, which is right for CI and wrong for a deploy —
    # killing flyctl mid-release can leave the app on a half-applied version.
    # Deploys queue instead.
    concurrency:
      group: deploy-fly
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # flyctl's own auth error is opaque, and a deploy that silently no-ops is
      # worse than a red build — say exactly what is missing and how to fix it.
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set. Create one with 'fly tokens create deploy -a relog' and add it with 'gh secret set FLY_API_TOKEN'."
            exit 1
          fi

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only builds the image on Fly's builders, so the runner needs
      # no Docker setup and the build layers stay cached between deploys.
      - name: Deploy
        run: flyctl deploy --remote-only --wait-timeout 10m
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # `flyctl deploy` returning 0 does not mean the app serves traffic. With
      # min_machines_running = 0 it does not wait on a health check, so a
      # machine that boots but never binds to the port ships as a green build
      # over a dead site — which is exactly what happened on the first
      # automated deploy. Probe the real URL before calling this a success.
      - name: Verify the deploy serves traffic
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          app=$(awk -F'"' '/^app *=/ {print $2; exit}' fly.toml)
          url="https://${app}.fly.dev/health"

          probe() {
            for i in $(seq 1 "$1"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$url" || true)
              if [ "$code" = "200" ]; then
                echo "healthy (HTTP 200) after $i attempt(s)"
                return 0
              fi
              echo "  attempt $i/$1: HTTP ${code:-none}"
              sleep 10
            done
            return 1
          }

          # The first request also wakes the machine, so this exercises the same
          # cold-start path a real visitor hits rather than a warmed-up one.
          echo "Probing $url"
          probe 12 && exit 0

          # Known failure mode: the machine starts, opens the database, then
          # stalls before binding. A restart clears it. Do that once so a wedged
          # boot doesn't leave the site down, but warn loudly — a deploy that
          # needed a restart is a bug to chase, not a normal outcome.
          echo "::warning title=Deploy needed a restart::App did not answer after the deploy; restarting once. If this recurs, investigate the cold-boot stall rather than relying on this retry."
          flyctl apps restart "$app"

          if probe 12; then
            echo "::warning::Recovered only after a restart."
            exit 0
          fi

          echo "::error::App is not serving after deploy and restart."
          flyctl status -a "$app" || true
          flyctl logs -a "$app" --no-tail | tail -50 || true
          exit 1

  python-integration:
    name: Python Integration
    runs-on: ubuntu-latest
    needs: [ci, python]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Setup Python
        run: uv python install 3.12

      - name: Install Python dependencies
        working-directory: python
        run: uv sync

      - name: Run integration tests
        working-directory: python
        run: uv run pytest tests/test_integration.py -v
