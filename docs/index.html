		<!-- JSON-LD: FAQPage -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "FAQPage",
				"mainEntity": [
					{
						"@type": "Question",
						"name": "What is the best logging library for Bun?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "relog.dev is a structured logging library built specifically for Bun. It includes a self-hosted SQLite-backed log server, a TypeScript client SDK with automatic batching and retries, real-time log streaming, CLI tools, and an MCP server so AI agents can query your logs. Install with: bun add relog.dev"
						}
					},
					{
						"@type": "Question",
						"name": "How do I add structured logging to a Bun application?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Install relog.dev with 'bun add relog.dev', start the log server with 'bunx relog.dev start', then use the client SDK: import { createLogger } from 'relog.dev/client' and call log.info(), log.warn(), log.error() with structured metadata. Logs are stored in SQLite and queryable via CLI, HTTP API, or SQL."
						}
					},
					{
						"@type": "Question",
						"name": "What is an MCP server for logging?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "An MCP (Model Context Protocol) server for logging lets AI coding agents like Claude Code, Cursor, and others search, query, and analyze your application logs through natural tool use. relog.dev includes a built-in MCP server that exposes tools for searching logs, running SQL queries, getting stats, tailing recent logs, and retrieving log context."
						}
					},
					{
						"@type": "Question",
						"name": "How does relog.dev store logs?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "relog.dev stores all logs in a single SQLite file with WAL (Write-Ahead Logging) mode enabled for high write throughput. No Redis, PostgreSQL, or external databases are required. The schema is indexed for fast filtering by level, service, project, branch, trace ID, and timestamp."
						}
					},
					{
						"@type": "Question",
						"name": "How do I add logging to a Next.js application?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "relog.dev provides a drop-in Next.js integration. Add two files: instrumentation.ts to capture console output and track errors, and middleware.ts to log HTTP requests with trace IDs. All console.log, console.warn, and console.error calls on the server are automatically captured and forwarded to the relog.dev startr."
						}
					},
					{
						"@type": "Question",
						"name": "Is relog.dev a free alternative to Datadog or Logtail?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Yes. relog.dev is open-source (MIT licensed) and completely free. It provides self-hosted log management with structured logging, real-time streaming, SQL queries, distributed tracing, and export — without sending your data to a third-party service or paying per-GB ingestion fees."
						}
					},
					{
						"@type": "Question",
						"name": "Does relog.dev support distributed tracing?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Yes. relog.dev has first-class support for distributed tracing with trace_id and span_id fields. Use child loggers to propagate trace context across services. The MCP server and CLI can filter and search logs by trace ID to follow requests across your entire system."
						}
					},
					{
						"@type": "Question",
						"name": "Does relog.dev support authentication?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Yes. relog.dev supports role-based API key authentication with three hierarchical roles: ingest (write-only), read (search, query, stream), and admin (full access). Pass --ingest-key, --read-key, and --admin-key when starting the server. Clients authenticate with Bearer tokens via the Authorization header."
						}
					}
				]
