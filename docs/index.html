		<!-- JSON-LD: FAQPage — must match visible FAQ in App.tsx -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "FAQPage",
				"mainEntity": [
					{
						"@type": "Question",
						"name": "Why not Datadog, Logtail, or Axiom?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "relog.dev is free, self-hosted, and MIT licensed. No per-GB ingestion fees, no third-party data sharing. Your logs stay on your infrastructure."
						}
					},
					{
						"@type": "Question",
						"name": "How does relog.dev store logs?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "All logs are stored in a single SQLite file with WAL mode enabled for high write throughput. The schema is indexed by level, service, project, branch, trace ID, and timestamp. No Redis, PostgreSQL, or external databases required."
						}
					},
					{
						"@type": "Question",
						"name": "What does the MCP server do?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "The built-in MCP (Model Context Protocol) server lets AI coding agents like Claude Code, Cursor, and any MCP client search, query, and analyze your application logs through natural tool use — including full-text search, SQL queries, stats, tailing, and trace context."
						}
					},
					{
						"@type": "Question",
						"name": "How does archival work?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Archive old logs to S3 as Parquet files with a single CLI command. DuckDB transparently queries both hot logs in SQLite and cold logs in S3, so search and SQL work across your entire history without loading everything into memory. Works with AWS S3, Cloudflare R2, MinIO, and Backblaze B2."
						}
					},
					{
						"@type": "Question",
						"name": "What are wide events?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Instead of scattering log lines through a request, build one event with all context and emit it at the end. Use .request(req) and .response(res) to auto-extract HTTP context. You get a single record with every key-value pair plus automatic duration tracking and level escalation."
						}
					},
					{
						"@type": "Question",
						"name": "How does tail sampling work?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Set a sampleRate (0–1) on the logger. The sampling decision happens after the event completes, so errors, slow requests, and .keep()-marked events are always kept. Only normal, fast events are sampled. Sampled events include the sample_rate in metadata so you can extrapolate totals in queries."
						}
					},
					{
						"@type": "Question",
						"name": "Does relog.dev support authentication?",
						"acceptedAnswer": {
							"@type": "Answer",
							"text": "Yes. Three hierarchical roles — ingest (write-only), read (search, query, stream), and admin (full access) — with Bearer token auth on all endpoints. Supports multiple API keys per role for multi-app environments."
						}
					}
				]
			}
		</script>

		<!-- JSON-LD: HowTo -->

			{
				"@context": "https://schema.org",

				"description": "Install relog.dev and start collecting structured logs with SQL queries, real-time streaming, and AI agent integration in under 60 seconds.",
				"step": [
					{
						"@type": "HowToStep",
						"name": "Install relog.dev",
						"text": "Run 'bun add relog.dev' to install the package."
					},
					{
						"@type": "HowToStep",
						"name": "Start the log server",
						"text": "Run 'bunx relog.dev start' to start the SQLite-backed log server on port 3485."
					},
					{
						"@type": "HowToStep",
						"name": "Send logs from your application",
						"text": "Import createLogger from 'relog.dev/client', create a logger instance with your server URL and service name, then call log.info(), log.warn(), log.error() with structured metadata."
					},
					{
						"@type": "HowToStep",
						"name": "Search and tail logs",
						"text": "Use 'bunx relog.dev tail' to stream logs in real-time, or 'bunx relog.dev search' to filter by level, service, project, and time range."
					}
				]
			}
