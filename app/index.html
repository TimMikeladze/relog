<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>relog — Log Explorer</title>
		<meta
			name="description"
			content="Browse, search, and query your relog.sh structured logs. Real-time streaming, SQL queries, distributed traces, and dashboards."
		/>
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#09090b" />
		<meta name="format-detection" content="telephone=no" />

		<!-- Don't index the app itself — the marketing site at relog.sh is the canonical entry point -->
		<meta name="robots" content="noindex, nofollow" />

		<!-- Open Graph (points back to marketing site for social sharing) -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://app.relog.sh" />
		<meta property="og:title" content="relog — Log Explorer" />
		<meta
			property="og:description"
			content="Browse, search, and query your structured logs. Real-time streaming, SQL queries, distributed traces, and dashboards."
		/>
		<meta property="og:site_name" content="relog.sh" />
		<meta property="og:image" content="https://relog.sh/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:alt" content="relog.sh — structured logging for the agentic era" />

		<!-- Icons -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
